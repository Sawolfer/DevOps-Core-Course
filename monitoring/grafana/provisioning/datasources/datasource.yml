apiVersion: 1

datasources:
  - name: Loki
    uid: grafana-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000

  - name: Prometheus
    uid: grafana-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true