---
# System provisioning playbook
# Installs common packages and Docker on target hosts
- name: Provision web servers
  hosts: webservers
  become: yes

  roles:
    - common
    - docker

  post_tasks:
    - name: Display provisioning completion message
      debug:
        msg: |
          ===================================
          Provisioning completed successfully!
          ===================================
          Host: {{ inventory_hostname }}
          IP: {{ ansible_host }}
          Docker version: {{ ansible_facts['packages']['docker-ce'][0]['version'] | default('installed') }}
          ===================================
