---
# Docker installation and configuration tasks

- name: Ensure required packages are present
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  tags:
    - docker
    - packages

- name: Create directory for Docker GPG key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags:
    - docker
    - setup

- name: Add Docker GPG key
  apt_key:
    url: "{{ docker_gpg_key_url }}"
    keyring: /etc/apt/keyrings/docker.gpg
    state: present
  tags:
    - docker
    - setup

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] {{ docker_repo_url }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  tags:
    - docker
    - setup
  notify: update apt cache

- name: Install Docker packages
  apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: yes
  tags:
    - docker
    - packages
  notify: restart docker

- name: Ensure Docker service is started and enabled
  service:
    name: docker
    state: started
    enabled: yes
  tags:
    - docker
    - service

- name: Add user to docker group
  user:
    name: "{{ docker_user }}"
    groups: docker
    append: yes
  tags:
    - docker
    - users

- name: Install Python Docker library
  pip:
    name:
      - docker
      - docker-compose
    state: present
    executable: pip3
  tags:
    - docker
    - python
