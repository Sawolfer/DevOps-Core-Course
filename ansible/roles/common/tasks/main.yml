---
# Common system setup tasks

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - common
    - packages

- name: Install common packages
  apt:
    name: "{{ common_packages }}"
    state: present
  tags:
    - common
    - packages

- name: Ensure Python pip is up to date
  pip:
    name: pip
    state: latest
    executable: pip3
  tags:
    - common
    - packages

- name: Set timezone
  community.general.timezone:
    name: "{{ system_timezone }}"
  tags:
    - common
    - timezone
