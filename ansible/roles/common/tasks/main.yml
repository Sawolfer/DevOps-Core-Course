---
# Common baseline configuration tasks.

- name: Common packages block
  become: true
  tags:
    - common
    - packages
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  rescue:
    - name: Recover apt cache update with fix-missing
      ansible.builtin.apt:
        update_cache: true
        update_cache_retries: 5
        update_cache_retry_max_delay: 12

    - name: Retry installing common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present
        update_cache: true

  always:
    - name: Log common packages block completion
      ansible.builtin.copy:
        dest: /tmp/common-packages-block.log
        content: "common packages block completed on {{ ansible_date_time.iso8601 }}\n"
        mode: "0644"

- name: Common users block
  become: true
  tags:
    - common
    - users
  block:
    - name: Ensure deploy group exists
      ansible.builtin.group:
        name: "{{ common_deploy_user }}"
        state: present

    - name: Ensure deploy user exists
      ansible.builtin.user:
        name: "{{ common_deploy_user }}"
        group: "{{ common_deploy_user }}"
        shell: "{{ common_deploy_user_shell }}"
        create_home: true
        state: present

  always:
    - name: Log common users block completion
      ansible.builtin.copy:
        dest: /tmp/common-users-block.log
        content: "common users block completed on {{ ansible_date_time.iso8601 }}\n"
        mode: "0644"
