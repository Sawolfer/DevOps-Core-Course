---
# Wipe logic runs first and only executes when both variable and tag gating are satisfied.
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  become: true
  tags:
    - app_deploy
    - compose
  block:
    - name: Ensure compose project directory exists
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Render Docker Compose template
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ web_app_compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy compose project
      community.docker.docker_compose_v2:
        project_src: "{{ web_app_compose_project_dir }}"
        state: present
        pull: always
        recreate: auto
        remove_orphans: true

  rescue:
    - name: Show deployment failure details
      ansible.builtin.debug:
        msg: "Docker Compose deployment failed for {{ web_app_name }}. Check Docker/registry connectivity and image tag."

  always:
    - name: Log web app deployment block completion
      ansible.builtin.copy:
        dest: "/tmp/{{ web_app_name }}-deploy-block.log"
        content: "web_app deploy block completed on {{ ansible_date_time.iso8601 }}\n"
        mode: "0644"
