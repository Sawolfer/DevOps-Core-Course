---
# Wipe logic for web application deployment.
# Double-gated safety:
# 1) Variable must be true: web_app_wipe=true
# 2) Wipe tag must be explicitly targeted: --tags web_app_wipe

- name: Wipe web application deployment
  when: web_app_wipe | bool
  become: true
  tags:
    - web_app_wipe
  block:
    - name: Stop and remove compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ web_app_compose_project_dir }}"
        state: absent
        remove_orphans: true
      failed_when: false

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}/docker-compose.yml"
        state: absent

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}"
        state: absent

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ web_app_name }} wiped successfully"
