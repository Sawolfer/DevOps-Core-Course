nameOverride: ""
fullnameOverride: ""

replicaCount: 3

image:
  repository: devops-info-service
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

env:
  host: 0.0.0.0

environment: dev
logLevel: info

config:
  mountPath: /config
  fileName: config.json
  featureFlags:
    visitsCounter: "true"

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""
  mountPath: /app/data
  visitsFileName: visits

serviceAccount:
  name: default

secret:
  enabled: true
  data:
    username: change-me
    password: change-me

vault:
  enabled: false
  role: devops-info-service
  secretPath: secret/data/myapp/config
  renderedFileName: config
  agentInjectCommand: ""

livenessProbe:
  path: /health
  port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /health
  port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
