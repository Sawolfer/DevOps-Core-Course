nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: devops-info-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30083

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

env:
  host: 0.0.0.0

environment: dev
logLevel: debug

serviceAccount:
  name: default

secret:
  enabled: true
  data:
    username: dev-user
    password: dev-pass

vault:
  enabled: false
  role: devops-info-service
  secretPath: secret/data/myapp/config
  renderedFileName: config
  agentInjectCommand: ""

livenessProbe:
  path: /health
  port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /health
  port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
