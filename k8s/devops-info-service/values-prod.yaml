nameOverride: ""
fullnameOverride: ""

replicaCount: 5

image:
  repository: devops-info-service
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30082

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  host: 0.0.0.0

environment: prod
logLevel: warning

serviceAccount:
  name: default

secret:
  enabled: true
  data:
    username: prod-user
    password: prod-pass

vault:
  enabled: false
  role: devops-info-service
  secretPath: secret/data/myapp/config
  renderedFileName: config
  agentInjectCommand: ""

livenessProbe:
  path: /health
  port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  path: /health
  port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
