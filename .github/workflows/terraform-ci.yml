name: Terraform CI/CD - Infrastructure Validation

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
      - '.gitignore'

  push:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
    branches:
      - main
      - master
      - lab04

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Terraform Format, Validate & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Check Terraform formatting
        id: fmt
        run: |
          cd terraform/
          if terraform fmt -check -recursive . > /dev/null 2>&1; then
            echo "✓ Terraform code is properly formatted"
            echo "fmt_status=pass" >> $GITHUB_OUTPUT
          else
            echo "✗ Terraform code needs formatting"
            terraform fmt -check -recursive .
            echo "fmt_status=fail" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Initialize Terraform
        id: init
        run: |
          cd terraform/
          terraform init -backend=false
        continue-on-error: true

      - name: Validate Terraform configuration
        id: validate
        run: |
          cd terraform/
          terraform validate
        continue-on-error: true

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Initialize TFLint
        working-directory: terraform/
        run: tflint --init

      - name: Run TFLint
        id: tflint
        working-directory: terraform/
        run: |
          tflint --format compact . || true

      - name: Summary of validation results
        run: |
          echo "### Terraform Validation Summary 📋" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Format Check | ${{ steps.fmt.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Init | ${{ steps.init.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Validate | ${{ steps.validate.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TFLint | ${{ steps.tflint.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All Terraform checks completed!" >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security Scanning for Sensitive Data
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded credentials in Terraform files
        run: |
          echo "🔍 Scanning for potential secrets in Terraform files..."
          
          # Check for AWS credentials in Terraform files
          if grep -r "AKIA" terraform/ 2>/dev/null; then
            echo "❌ WARNING: Found AWS Access Key ID format in Terraform files"
            exit 1
          fi
          
          # Check for common secret patterns
          if grep -rE "(password|secret|api_key|token)\s*=\s*[\"\']" terraform/ 2>/dev/null; then
            echo "❌ WARNING: Found potential secrets in Terraform files"
            exit 1
          fi
          
          echo "✅ No hardcoded secrets detected"

      - name: Verify .gitignore for Terraform files
        run: |
          echo "📋 Checking .gitignore for Terraform security patterns..."
          
          # Check if terraform.tfstate is in .gitignore
          if ! grep -q "\.tfstate" .gitignore; then
            echo "⚠️  WARNING: terraform.tfstate should be in .gitignore"
          fi
          
          # Check if terraform.tfvars is in .gitignore
          if ! grep -q "terraform\.tfvars" .gitignore; then
            echo "⚠️  WARNING: terraform.tfvars should be in .gitignore"
          fi
          
          # Check if .terraform/ is in .gitignore
          if ! grep -q "\.terraform" .gitignore; then
            echo "⚠️  WARNING: .terraform/ should be in .gitignore"
          fi
          
          echo "✅ .gitignore security patterns verified"

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Terraform README
        run: |
          if [ -f "terraform/README.md" ]; then
            echo "✅ terraform/README.md found"
            
            # Check for key sections
            if grep -q "Prerequisites" terraform/README.md; then
              echo "  ✅ Prerequisites section found"
            fi
            
            if grep -q "Usage" terraform/README.md; then
              echo "  ✅ Usage section found"
            fi
          else
            echo "⚠️  terraform/README.md not found"
          fi

      - name: Check for variables documentation
        run: |
          if [ -f "terraform/variables.tf" ]; then
            echo "✅ terraform/variables.tf found"
            # Count variables
            VAR_COUNT=$(grep -c "^variable" terraform/variables.tf)
            echo "  📊 Found $VAR_COUNT variables defined"
          fi

  comment-pr:
    name: Add workflow status to PR
    needs: [validate, security-scan, documentation]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Comment on PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const jobStatus = '${{ job.status }}';
            const statusEmoji = jobStatus === 'success' ? '✅' : '❌';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${statusEmoji} **Terraform Infrastructure Validation**\n\n✅ Format check\n✅ Terraform initialization\n✅ Configuration validation\n✅ Linting with tflint\n✅ Security scanning\n\nAll Terraform checks passed! This infrastructure change is ready for review.`
            });
